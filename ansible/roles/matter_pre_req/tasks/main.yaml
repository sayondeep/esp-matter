- name: Install esp-matter pre-requisites
  become: true
  ansible.builtin.apt:
    name:
      - git
      - gcc
      - g++
      - pkg-config
      - libssl-dev
      - libdbus-1-dev
      - libglib2.0-dev
      - libavahi-client-dev
      - ninja-build
      - python3-venv
      - python3-dev
      - python3-pip
      - unzip
      - libgirepository1.0-dev
      - libcairo2-dev
      - libreadline-dev
      - wget
      - flex
      - bison
      - gperf
      - python3
      - cmake
      - ccache
      - libffi-dev
      - dfu-util
      - libusb-1.0-0
    state: latest
    update_cache: true
  when: ansible_system == 'Linux'


